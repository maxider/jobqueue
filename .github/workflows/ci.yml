name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: go build ./...
        working-directory: go
      - run: go vet ./...
        working-directory: go
      - run: go test ./... -race
        working-directory: go
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: go
