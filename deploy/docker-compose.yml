name: job-queue

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/server"]
    command: ["-grpc-addr=:50051", "-metrics-addr=:2112"]
    ports:
      - "2112:2112"
      - "50051:50051"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/worker"]
    command: ["-server-addr=server:50051"]
    depends_on:
      - server

  producer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/producer"]
    command: ["-server-addr=server:50051"]
    depends_on:
      - server

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - server

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
