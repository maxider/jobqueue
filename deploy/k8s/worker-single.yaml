apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-single
  namespace: job-queue
spec:
  # Starting replica count; the KEDA ScaledObject (scaledobject.yaml) takes
  # over from here based on queue_pending_jobs.
  replicas: 1
  selector:
    matchLabels:
      app: worker-single
  template:
    metadata:
      labels:
        app: worker-single
    spec:
      containers:
        - name: worker-single
          image: jobqueue:dev
          imagePullPolicy: IfNotPresent
          command: ["/worker-single"]
          args:
            - -server-addr=server:50051
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
