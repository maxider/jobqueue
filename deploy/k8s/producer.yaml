apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: job-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: jobqueue:dev
          imagePullPolicy: IfNotPresent
          command: ["/producer"]
          args:
            - -server-addr=server:50051
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
