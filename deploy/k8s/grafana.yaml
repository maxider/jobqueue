# The grafana-datasources and grafana-dashboards ConfigMaps referenced below
# aren't defined here on purpose: they're generated from the single source
# of truth at deploy/grafana/provisioning/ by `make kind-up` (or manually,
# see README), so the dashboard JSON doesn't have to be duplicated/kept in
# sync between docker-compose's and Kubernetes' Grafana.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: job-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: job-queue
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
