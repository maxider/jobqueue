apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: job-queue
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: job-queue
        static_configs:
          - targets: ["server:2112"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: job-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: job-queue
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
