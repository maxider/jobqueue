syntax = "proto3";

package jobqueue.v1;

option go_package = "github.com/maxider/job-queue/gen/jobqueue/v1;jobqueuev1";

import "google/protobuf/timestamp.proto";

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_COMPLETE = 3;
  JOB_STATUS_DEAD = 4;
}

message Job {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  uint32 attempts = 4;
  uint32 max_attempts = 5;
  JobStatus status = 6;
  google.protobuf.Timestamp lease_expiration = 7;
  bytes payload = 8;
  string last_error = 9;
  string last_worker_id = 10;
}

message EnqueueRequest {
  bytes payload = 1;
  uint32 max_attempts = 2;
}

message EnqueueResponse {
  string job_id = 1;
  bool accepted = 2;
}

message ClaimRequest {
  string worker_id = 1;
}

message ClaimResponse {
  // found is false and job is unset when no job is currently pending.
  bool found = 1;
  Job job = 2;
}

message CompleteRequest {
  string job_id = 1;
  string worker_id = 2;
}

message CompleteResponse {}

message FailRequest {
  string job_id = 1;
  string worker_id = 2;
  string error = 3;
}

message FailResponse {}

// JobQueueService lets producers and workers reach a JobQueue over the
// network instead of holding a direct in-process reference to it.
service JobQueueService {
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse);
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  rpc Complete(CompleteRequest) returns (CompleteResponse);
  rpc Fail(FailRequest) returns (FailResponse);
}
